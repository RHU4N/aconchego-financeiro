name: CI — Aconchego Finanças

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: TypeScript, Testes e Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Verificar tipagem TypeScript
        run: npm run lint

      - name: Executar suíte de testes automatizados
        run: npm test

      - name: Build de produção (Vite)
        run: npm run build
